<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rain.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rain</title>
    <!-- Applies the stored theme before the first paint, so there is no flash. Keep the list in step with useTheme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('rain.theme')
        var root = document.documentElement
        var applied = false
        // A theme from VS Code: its resolved colours were stored the last time it was applied.
        if (theme === 'vscode') {
          var saved = JSON.parse(localStorage.getItem('rain.theme.vscode') || 'null')
          if (saved && saved.tokens && saved.tokens.background) {
            for (var name in saved.tokens) {
              if (/^[a-z0-9-]+$/.test(name) && typeof saved.tokens[name] === 'string') {
                root.style.setProperty('--' + name, saved.tokens[name])
              }
            }
            root.style.setProperty('color-scheme', saved.dark === false ? 'light' : 'dark')
            root.dataset.theme = 'vscode'
            root.classList.toggle('dark', saved.dark !== false)
            applied = true
          }
        }
        if (!applied) {
          if (['dark', 'high-contrast', 'dim', 'midnight', 'light'].indexOf(theme) < 0) theme = 'dark'
          root.dataset.theme = theme
          root.classList.toggle('dark', theme !== 'light')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
