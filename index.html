<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rain.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rain</title>
    <!-- Applies the stored theme before the first paint, so there is no flash. Keep the list in step with useTheme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('rain.theme')
        if (['dark', 'high-contrast', 'dim', 'midnight', 'light'].indexOf(theme) < 0) theme = 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme !== 'light')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
