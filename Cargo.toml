# The Cargo workspace of Rain. One lock file and one `target` folder for every program.
# Design: docs/backend/00-foundation.md section 1.

[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
default-members = ["src-tauri", "crates/rain-backend", "crates/rain-hook"]   # `cargo build` builds the shell, the backend and the hook (the hooks switch needs rain-hook.exe next to the backend)

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"            # the version every spike compiled with; lowering it is untested
license = "MIT"
# repository = "..."              # set when the repository is published

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"              # allowed in tests (clippy.toml); in start-up code only with a comment
expect_used = "allow"

# Development builds: small debug information, so that `target` stays a few GB and not tens of GB.
# Rain's own code keeps file names and line numbers (enough for a panic message and a backtrace);
# the dependencies carry none. Full debug information for a debugger session: set `debug = true`
# here for the time of the session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
# `unwind`, NOT `abort`: a panic inside a request handler must become an HTTP 500, not end the process.
# `panic` cannot be set per package, so it applies to every program.
panic = "unwind"

# The hook is small and short-lived (foundation 1.4).
[profile.release.package.rain-hook]
opt-level = "z"

# The only place where dependency versions are written. A member says `name = { workspace = true }`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }   # preserve_order: the installer keeps the key order of the user's Claude settings. NEVER add arbitrary_precision (see tests/source_rules.rs)
serde_repr = "0.1"
ts-rs = "12.0.1"                  # default features only (serde-compat); see section 9
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.54", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
hyper = { version = "1.12", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service", "server", "http1", "client", "client-legacy"] }
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "registry"] }
tracing-appender = "0.2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Console"] }
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }   # reads typed values from the user's TOML files
toml_edit = "0.25.20"             # edits those files and keeps their comments and order
tempfile = "3.27"
rusqlite = { version = "0.43", features = ["bundled"] }   # SQLite for history and caches
notify = "9.0.0"                  # file watching
notify-debouncer-full = "0.8.0"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }                               # all unsafe Windows API code is in rain-backend `platform/`
winreg = "0.56"                   # registry: autostart value, Steam path
png = "0.18"                      # icons as PNG
rayon = "1.12"                    # the disk walker's thread pool, built for one scan (section 05)
# jobs (section 03): cron schedules. `chrono` stays inside the jobs module (foundation 1.6).
croner = "5.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"              # dev-dependency of rain-backend only: DST tests of the schedule
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }   # hardware (section 05): lists HID devices and reads them. The windows-native backend needs no C compiler
yaml-rust2 = "0.13.2"            # TEST ONLY (life): an independent YAML parser that checks the frontmatter editor
