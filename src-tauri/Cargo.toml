[package]
name = "rain"
version = "0.1.0"
description = "Rain desktop shell: the window that hosts the frontend"
license = "MIT"
repository = "https://github.com/HaAbdullah/Rain"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
